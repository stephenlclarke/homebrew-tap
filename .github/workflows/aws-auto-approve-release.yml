name: AWS Auto Approve Release
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: aws-auto-approve-release
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Propose the latest verified release
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_AUTO_APPROVE_REVIEW_TOKEN: ${{ secrets.AWS_AUTO_APPROVE_REVIEW_TOKEN }}
        run: bash scripts/update-aws-auto-approve.sh

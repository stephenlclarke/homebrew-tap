---
# yamllint disable rule:truthy rule:line-length

name: Homebrew

on:
  push:
    branches:
      - main
    paths:
      - "Formula/**"
      - "INSTALL.md"
      - "README.md"
      - "scripts/sync-formulae.sh"
      - "scripts/update-aws-auto-approve.sh"
      - "scripts/test-aws-release-update.sh"
      - ".github/workflows/aws-auto-approve-release.yml"
      - ".gitmodules"
      - "sources/**"
      - ".github/workflows/homebrew.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Formula/**"
      - "INSTALL.md"
      - "README.md"
      - "scripts/sync-formulae.sh"
      - "scripts/update-aws-auto-approve.sh"
      - "scripts/test-aws-release-update.sh"
      - ".github/workflows/aws-auto-approve-release.yml"
      - ".gitmodules"
      - "sources/**"
      - ".github/workflows/homebrew.yml"
  workflow_dispatch:
    inputs:
      formula:
        description: Optional formula name to validate instead of all formulae
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: homebrew-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  formula:
    name: Formula Syntax
    runs-on: macos-26
    steps:
      - name: Checkout tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check synchronized formulae
        run: scripts/sync-formulae.sh --check

      - name: Check AWS release update boundaries
        run: |
          bash -n scripts/update-aws-auto-approve.sh
          bash scripts/test-aws-release-update.sh

      - name: Validate Ruby syntax
        run: |
          for formula in Formula/*.rb; do
            ruby -c "${formula}"
          done

      - name: Reject stale compose install lanes
        run: |
          set -euo pipefail
          if grep -R -n -E 'homebrew-develop|develop-debug|container-compose-plugin-develop|container-compose-snapshot|snapshot-bootstrap|snapshot/.+debug|sources/container-compose.*:.*develop' \
            README.md INSTALL.md Formula/*.rb; then
            printf 'stale compose develop or snapshot install lane reference found\n' >&2
            exit 1
          fi

      - name: Select formulae for Homebrew smoke
        id: formulae
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_FORMULA: ${{ inputs.formula }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files="${RUNNER_TEMP}/changed-files.txt"

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" \
                --paginate \
                --jq '.[] | select(.status != "removed") | .filename' > "$changed_files"
              ;;
            push)
              before="${{ github.event.before }}"
              after="${GITHUB_SHA}"
              if [[ "$before" =~ ^0+$ ]]; then
                git diff-tree --no-commit-id --name-only --diff-filter=ACMR -r "$after" > "$changed_files"
              else
                git diff --name-only --diff-filter=ACMR "$before" "$after" > "$changed_files"
              fi
              ;;
            *)
              if [[ -n "$REQUESTED_FORMULA" ]]; then
                [[ "$REQUESTED_FORMULA" =~ ^[a-z0-9][a-z0-9-]*$ ]]
                test -f "Formula/$REQUESTED_FORMULA.rb"
                printf 'Formula/%s.rb\n' "$REQUESTED_FORMULA" > "$changed_files"
              else
                find Formula -maxdepth 1 -type f -name '*.rb' | sort > "$changed_files"
              fi
              ;;
          esac

          grep -E '^Formula/[^/]+\.rb$' "$changed_files" | sort -u > "${RUNNER_TEMP}/formulae.txt" || true
          if [[ ! -s "${RUNNER_TEMP}/formulae.txt" && "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            find Formula -maxdepth 1 -type f -name '*.rb' | sort > "${RUNNER_TEMP}/formulae.txt"
          fi

          {
            printf 'paths<<EOF\n'
            cat "${RUNNER_TEMP}/formulae.txt"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Tap local formulae
        run: |
          set -euo pipefail
          brew tap stephenlclarke/tap "${GITHUB_WORKSPACE}"
          brew trust --tap stephenlclarke/tap

      - name: Audit selected formulae
        env:
          FORMULA_PATHS: ${{ steps.formulae.outputs.paths }}
        run: |
          set -euo pipefail
          while IFS= read -r formula; do
            [[ -n "$formula" ]] || continue
            name="$(basename "${formula}" .rb)"
            brew audit --formula --strict --online "stephenlclarke/tap/${name}"
          done <<< "$FORMULA_PATHS"

      - name: Fetch selected formula archives
        env:
          FORMULA_PATHS: ${{ steps.formulae.outputs.paths }}
        run: |
          set -euo pipefail

          is_head_only() {
            brew info --json=v2 --formula "$1" | python3 -c \
              'import json, sys; sys.exit(0 if json.load(sys.stdin)["formulae"][0]["versions"]["stable"] is None else 1)'
          }

          while IFS= read -r formula; do
            [[ -n "$formula" ]] || continue
            name="$(basename "${formula}" .rb)"
            fetch_args=()
            if is_head_only "stephenlclarke/tap/${name}"; then
              fetch_args+=(--HEAD)
            fi
            if ((${#fetch_args[@]})); then
              brew fetch --formula --force "${fetch_args[@]}" "stephenlclarke/tap/${name}"
            else
              brew fetch --formula --force "stephenlclarke/tap/${name}"
            fi
          done <<< "$FORMULA_PATHS"

      - name: Install and test selected formulae
        env:
          FORMULA_PATHS: ${{ steps.formulae.outputs.paths }}
        run: |
          set -euo pipefail

          is_head_only() {
            brew info --json=v2 --formula "$1" | python3 -c \
              'import json, sys; sys.exit(0 if json.load(sys.stdin)["formulae"][0]["versions"]["stable"] is None else 1)'
          }

          while IFS= read -r formula; do
            [[ -n "$formula" ]] || continue
            name="$(basename "${formula}" .rb)"
            install_args=()
            if is_head_only "stephenlclarke/tap/${name}"; then
              install_args+=(--HEAD)
            fi
            if ((${#install_args[@]})); then
              brew install --formula "${install_args[@]}" "stephenlclarke/tap/${name}"
            else
              brew install --formula "stephenlclarke/tap/${name}"
            fi
            brew test "stephenlclarke/tap/${name}"
          done <<< "$FORMULA_PATHS"

      - name: Inspect selected formulae
        env:
          FORMULA_PATHS: ${{ steps.formulae.outputs.paths }}
        run: |
          set -euo pipefail
          while IFS= read -r formula; do
            [[ -n "$formula" ]] || continue
            name="$(basename "${formula}" .rb)"
            brew info --formula "stephenlclarke/tap/${name}"
          done <<< "$FORMULA_PATHS"
